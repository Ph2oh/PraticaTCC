<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo logo (esquerda) com gradiente -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="32" cy="32" r="28" fill="url(#blueGradient)"/>
  
  <!-- Três barras de crescimento -->
  <rect x="16" y="39" width="6" height="11" rx="1" fill="white" opacity="0.85"/>
  <rect x="25" y="31" width="6" height="19" rx="1" fill="white"/>
  <rect x="34" y="23" width="6" height="27" rx="1" fill="white" opacity="0.95"/>
  
  <!-- Linha de tendência -->
  <path d="M 19 38 Q 28 26 40 20" stroke="#10B981" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Ponto na linha -->
  <circle cx="40" cy="20" r="2" fill="#10B981"/>
  
  <!-- Linha divisória -->
  <line x1="62" y1="12" x2="62" y2="52" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Texto: SGO -->
  <text x="80" y="38" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#1E293B" letter-spacing="1">SGO</text>
  
  <!-- Subtexto: Gerenciamento de Orçamentos -->
  <text x="80" y="54" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#64748B" letter-spacing="0.5" font-weight="500">Gerenciamento de Orçamentos</text>
</svg>