<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo fundo azul gradiente -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="32" cy="32" r="30" fill="url(#blueGradient)"/>
  
  <!-- Três barras de crescimento com espaçamento melhor -->
  <rect x="18" y="40" width="7" height="12" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="28" y="32" width="7" height="20" rx="1.5" fill="white"/>
  <rect x="38" y="24" width="7" height="28" rx="1.5" fill="white" opacity="0.95"/>
  
  <!-- Linha de tendência conectando os topos -->
  <path d="M 21.5 39 Q 31.5 27 44.5 22" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Ponto na linha (receita alcançada) -->
  <circle cx="44.5" cy="22" r="2.5" fill="#10B981"/>
  
  <!-- Ponto de partida (sutil) -->
  <circle cx="21.5" cy="39" r="1.5" fill="white" opacity="0.6"/>
</svg>