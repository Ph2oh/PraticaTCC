<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" stroke="#000" fill="none">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" stroke="none" />
  </marker>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" stroke="none"/>

<!-- SIDEBAR -->
<rect x="0" y="0" width="240" height="900"/>
<circle cx="40" cy="40" r="12"/>
<rect x="60" y="30" width="120" height="18"/>

<rect x="20" y="100" width="200" height="36"/>
<rect x="20" y="150" width="200" height="36" fill="#e2e8f0" stroke="none"/> <!-- ACTIVE -->
<rect x="20" y="200" width="200" height="36"/>
<rect x="20" y="250" width="200" height="36"/>
<rect x="20" y="300" width="200" height="36"/>

<!-- INDICATOR ARROW -->
<path d="M 230 168 L 240 158 L 240 178 Z" fill="#000" stroke="none"/>

<!-- HEADER -->
<rect x="240" y="0" width="1200" height="80"/>
<rect x="300" y="30" width="200" height="20"/>
<rect x="1250" y="20" width="140" height="40" rx="4"/> <!-- BOTAO NOVO -->

<!-- KANBAN COLUMNS -->
<!-- COL 1 -->
<rect x="280" y="110" width="260" height="750" rx="8"/>
<rect x="300" y="130" width="120" height="15"/>

<rect x="290" y="160" width="240" height="100" rx="4"/>
<rect x="305" y="180" width="150" height="15"/>
<rect x="305" y="205" width="100" height="10"/>
<rect x="305" y="230" width="80" height="15"/>

<rect x="290" y="280" width="240" height="100" rx="4"/>
<rect x="305" y="300" width="150" height="15"/>

<!-- COL 2 -->
<rect x="560" y="110" width="260" height="750" rx="8"/>
<rect x="580" y="130" width="120" height="15"/>
<rect x="570" y="160" width="240" height="100" rx="4"/>

<!-- COL 3 -->
<rect x="840" y="110" width="260" height="750" rx="8"/>
<rect x="860" y="130" width="120" height="15"/>

<!-- COL 4 -->
<rect x="1120" y="110" width="260" height="750" rx="8"/>
<rect x="1130" y="160" width="240" height="100" rx="4"/>

<!-- FLOW NAVIGATION (Novo Lead -> Modal Novo) -->
<path d="M 1320 60 C 1320 120 1360 150 1360 220" stroke="#000" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
<!-- KANBAN DRAG FLOW -->
<path d="M 430 250 C 480 320 520 220 580 250" stroke="#000" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

</svg>
