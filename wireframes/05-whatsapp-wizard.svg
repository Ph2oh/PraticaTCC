<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" stroke="#000" fill="none">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" stroke="none" />
  </marker>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" stroke="none"/>

<!-- SIDEBAR -->
<rect x="0" y="0" width="240" height="900"/>
<circle cx="40" cy="40" r="12"/>
<rect x="60" y="30" width="120" height="18"/>

<rect x="20" y="100" width="200" height="36"/>
<rect x="20" y="150" width="200" height="36"/>
<rect x="20" y="200" width="200" height="36"/>
<rect x="20" y="250" width="200" height="36"/>
<rect x="20" y="300" width="200" height="36" fill="#e2e8f0" stroke="none"/> <!-- ACTIVE -->

<!-- INDICATOR ARROW -->
<path d="M 230 318 L 240 308 L 240 328 Z" fill="#000" stroke="none"/>

<!-- HEADER -->
<rect x="240" y="0" width="1200" height="80"/>
<rect x="300" y="30" width="200" height="20"/>

<!-- CONTENT TITLES -->
<rect x="300" y="140" width="150" height="15"/>
<rect x="300" y="180" width="400" height="40"/>

<!-- LEFT COLUMN BULLETS -->
<rect x="300" y="260" width="350" height="15"/>
<rect x="300" y="300" width="300" height="15"/>
<rect x="300" y="340" width="380" height="15"/>

<!-- LEFT COLUMN INFOCARD -->
<rect x="300" y="400" width="400" height="180" rx="8"/>
<rect x="330" y="430" width="150" height="20"/>
<rect x="330" y="480" width="250" height="15"/>
<rect x="330" y="520" width="250" height="15"/>

<!-- RIGHT COLUMN (QR BOX) -->
<rect x="850" y="180" width="450" height="550" rx="16"/>
<rect x="950" y="230" width="250" height="20"/>
<rect x="950" y="270" width="150" height="12"/>

<rect x="900" y="320" width="350" height="300" rx="8"/>
<rect x="1000" y="390" width="150" height="150"/>
<rect x="1010" y="400" width="30" height="30"/>
<rect x="1110" y="400" width="30" height="30"/>

<rect x="900" y="650" width="350" height="40" rx="8"/> <!-- BOTAO GERAR -->

<!-- FLOW NAVIGATION (Botao Gerar -> Executa a acão no sistema) -->
<path d="M 1075 690 C 1075 750 1150 780 1250 780" stroke="#000" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

</svg>
