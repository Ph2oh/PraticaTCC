<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" stroke="#000" fill="none">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" stroke="none" />
  </marker>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" stroke="none"/>
<rect x="0" y="0" width="240" height="900"/>
<circle cx="40" cy="40" r="12"/>
<rect x="60" y="30" width="120" height="18"/>

<rect x="20" y="100" width="200" height="36"/>
<rect x="20" y="150" width="200" height="36" fill="#e2e8f0" stroke="none"/> <!-- ACTIVE -->
<rect x="20" y="200" width="200" height="36"/>
<rect x="20" y="250" width="200" height="36"/>
<rect x="20" y="300" width="200" height="36"/>
<path d="M 230 168 L 240 158 L 240 178 Z" fill="#000" stroke="none"/>

<rect x="240" y="0" width="1200" height="80"/>

<!-- MODAL OVERLAY -->
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" fill-opacity="0.8" stroke="none"/>

<!-- MODAL BOX -->
<rect x="420" y="180" width="600" height="540" fill="#ffffff" rx="16"/>

<!-- HEADER -->
<circle cx="470" cy="230" r="16"/> <!-- XCircle Icon -->
<rect x="500" y="222" width="200" height="16"/>
<rect x="460" y="260" width="500" height="10"/>

<!-- RADIO OPTIONS CARDS -->
<!-- Option 1 -->
<rect x="460" y="300" width="520" height="64" rx="8"/>
<circle cx="490" cy="332" r="8"/> <!-- Radio -->
<circle cx="490" cy="332" r="4" fill="#000" stroke="none"/> <!-- Checked -->
<rect x="520" y="320" width="160" height="12"/>
<rect x="520" y="340" width="300" height="8"/>

<!-- Option 2 -->
<rect x="460" y="380" width="520" height="64" rx="8"/>
<circle cx="490" cy="412" r="8"/>
<rect x="520" y="400" width="180" height="12"/>
<rect x="520" y="420" width="300" height="8"/>

<!-- Option 3 -->
<rect x="460" y="460" width="520" height="64" rx="8"/>
<circle cx="490" cy="492" r="8"/>
<rect x="520" y="480" width="150" height="12"/>
<rect x="520" y="500" width="300" height="8"/>

<!-- BUTTONS FOOTER -->
<rect x="680" y="560" width="140" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/> <!-- CANCEL (Red) -->
<rect x="840" y="560" width="140" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/> <!-- CONFIRM (Green) -->

<!-- FLOW NAVIGATION (Salvar -> Fecha modal/Vai p/ Kanban) -->
<path d="M 980 580 C 1050 580 1100 500 1100 400" stroke="#000" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

</svg>
