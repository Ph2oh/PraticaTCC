<rect x="20" y="200" width="200" height="36"/>
<rect x="20" y="250" width="200" height="36"/>
<rect x="20" y="300" width="200" height="36"/>

<path d="M 230 168 L 240 158 L 240 178 Z" fill="#000" stroke="none"/>
<rect x="240" y="0" width="1200" height="80"/>

<!-- MODAL OVERLAY -->
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" fill-opacity="0.7" stroke="none"/>

<!-- MODAL BOX -->
