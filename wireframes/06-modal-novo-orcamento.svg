<rect x="740" y="495" width="150" height="15"/>
<rect x="740" y="520" width="240" height="36" rx="4"/>

<!-- BUTTONS -->
<rect x="680" y="660" width="140" height="36" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/> <!-- CANCEL (RED) -->
<rect x="840" y="660" width="140" height="36" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/> <!-- SAVE (GREEN) -->

<!-- FLOW NAVIGATION (Salvar -> Fecha modal/Volta Kanban) -->
